[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "megacap-scanner"
version = "0.1.0"
description = "Tech mega-cap dependency graph stock scanner with walk-forward backtesting"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10.0",
    "yfinance>=0.2.40",
    "vectorbt>=0.26.1",
    "typer[all]>=0.12.0",
    "pyyaml>=6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "apscheduler>=3.10.0",
    "anthropic>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
scanner = "scanner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
